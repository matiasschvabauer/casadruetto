<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="../casadruettologo1.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | Casa Druetto</title>
    <!-- Google Fonts -->
    <link rel="stylesheet" href="../assets/css/css2.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/admin-styles.css">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/web-alerts.js"></script>
</head>
<body class="admin-body">

    <div class="admin-login-wrapper">
        <div class="admin-login-box">
            
            <div style="text-align:center; margin-bottom:2rem;">
                <img src="../assets/img/casadruettologo1.png" style="width:85px; margin: 0 auto 1.25rem; display:block;" alt="Logo Casa Druetto">
                <h2 style="font-family:'Montserrat',sans-serif; font-size:1.4rem; font-weight:800; color:#111827; margin-bottom:0.35rem;">Panel de Administración</h2>
                <p style="color:var(--admin-text-muted); font-size:0.85rem; margin-top:0.25rem;">Acceso exclusivo para administradores autorizados.</p>
            </div>

            <!-- Botón Único de Inicio de Sesión con Google -->
            <div style="margin-bottom: 1.5rem;">
                <button type="button" id="google-login-btn" onclick="window.loginWithGoogle()" 
                    style="width:100%; display:flex; align-items:center; justify-content:center; gap:12px; padding:1rem; background-color:#ffffff; color:#374151; border:1px solid #d1d5db; border-radius:8px; font-weight:700; font-size:0.95rem; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.08); transition:all 0.2s ease;">
                    <svg width="20" height="20" viewBox="0 0 18 18">
                        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"/>
                        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"/>
                        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
                        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
                    </svg>
                    <span>Iniciar Sesión con Google</span>
                </button>
            </div>

            <div id="login-error" style="background-color:rgba(244,67,54,0.15); border:1px solid var(--admin-danger); color:#d32f2f; padding:0.75rem; border-radius:6px; margin-bottom:1.5rem; font-size:0.85rem; display:none; text-align:center;">
                Acceso no autorizado.
            </div>

            <div style="text-align:center; margin-top:2rem;">
                <a href="../tienda.html" style="color:var(--admin-accent); font-size:0.9rem; font-weight:600;"><i class="fas fa-arrow-left"></i> Volver a la Tienda</a>
            </div>

        </div>
    </div>

    <!-- Scripts de Autenticación -->
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/auth.js"></script>
</body>
</html>
