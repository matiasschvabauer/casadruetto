<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="casadruettologo1.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detalle de Producto Móvil | Casa Druetto</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet" href="assets/css/css2.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Mobile CSS & Styles -->
    <link rel="stylesheet" href="css/mobile-styles.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/mobile-detect.js"></script>
</head>
<body class="m-body">

    <!-- ─── HEADER MÓVIL SUPERIOR ─── -->
    <header class="m-header">
        <div class="m-header-top">
            <a href="m_tienda.html" style="font-size:1.2rem; color:#111827; text-decoration:none;"><i class="fas fa-arrow-left"></i> Volver</a>
            <a href="m_index.html" class="m-logo-link">
                <img src="assets/img/casadruettologo1.png" alt="75 Años" class="m-logo-badge">
            </a>
            <button onclick="toggleCart(true)" class="m-header-btn" title="Carrito">
                <i class="fas fa-shopping-cart"></i>
                <span id="cart-badge" class="m-cart-badge">0</span>
            </button>
        </div>
    </header>

    <!-- ─── CONTENIDO DE PRODUCTO MÓVIL ─── -->
    <main class="m-section" id="m-product-detail-container">
        <!-- Carga dinámica -->
        <p style="text-align:center; padding:3rem; color:#6b7280;">Cargando detalles del equipo...</p>
    </main>

    <!-- ─── BOTÓN FLOTANTE WHATSAPP ─── -->
    <a href="https://wa.me/5493404521246" class="m-floating-wa" target="_blank" title="Contactar por WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- ─── NAVEGACIÓN INFERIOR FIJA MÓVIL ─── -->
    <nav class="m-bottom-nav">
        <a href="m_index.html" class="m-nav-item">
            <i class="fas fa-home"></i>
            <span>Inicio</span>
        </a>
        <a href="m_tienda.html" class="m-nav-item active">
            <i class="fas fa-store"></i>
            <span>Tienda</span>
        </a>
        <button onclick="toggleCart(true)" class="m-nav-item">
            <i class="fas fa-shopping-cart"></i>
            <span>Carrito</span>
        </button>
        <a href="m_contacto.html" class="m-nav-item">
            <i class="fas fa-envelope"></i>
            <span>Contacto</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/cart.js"></script>
    <script type="module" src="js/products.js"></script>
    <script src="js/mobile-app.js"></script>
    <script type="module">
        import { getProductById } from './js/products.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const container = document.getElementById('m-product-detail-container');
            if (!container) return;

            if (!id) {
                container.innerHTML = '<p style="text-align:center; padding:2rem;">Producto no especificado.</p>';
                return;
            }

            const p = await getProductById(id);
            if (!p) {
                container.innerHTML = '<p style="text-align:center; padding:2rem;">Producto no encontrado.</p>';
                return;
            }

            const imgUrl = p.images?.[0] || 'assets/img/casadruettologo1.png';
            const priceArs = Math.round(p.price * 1530).toLocaleString('es-AR');

            container.innerHTML = `
                <div style="background:#fff; border-radius:10px; padding:1rem; border:1px solid #e5e7eb; margin-bottom:1rem; text-align:center;">
                    <img src="${imgUrl}" alt="${p.name}" style="max-width:100%; height:200px; object-fit:contain;">
                </div>
                <div style="background:#fff; border-radius:10px; padding:1.25rem; border:1px solid #e5e7eb; display:flex; flex-direction:column; gap:0.75rem;">
                    <span style="font-size:0.75rem; font-weight:700; color:#059669; text-transform:uppercase;">${p.category}</span>
                    <h1 style="font-size:1.3rem; font-weight:800; color:#111827;">${p.name}</h1>
                    <small style="color:#6b7280;">Código: ${p.code}</small>
                    
                    <div style="margin: 0.5rem 0;">
                        <div style="font-size:1.5rem; font-weight:800; color:#111827;">$${p.price.toLocaleString('es-AR')} USD</div>
                        <div style="font-size:1.1rem; font-weight:700; color:#059669;">$${priceArs} ARS</div>
                    </div>

                    <div style="background:#f9fafb; padding:0.75rem; border-radius:6px; border:1px solid #e5e7eb; font-size:0.85rem; color:#4b5563;">
                        <i class="fas fa-truck" style="color:#10b981;"></i> <strong>Envío a todo el país</strong><br>
                        <i class="fas fa-store" style="color:#10b981; margin-top:0.35rem;"></i> Retiro gratis en sucursal (Gálvez, Santa Fe)
                    </div>

                    <p style="font-size:0.88rem; color:#374151; line-height:1.6; margin-top:0.5rem;">${p.desc || 'Sin descripción detallada disponible.'}</p>

                    <button class="m-btn m-btn-primary" onclick="addToCart('${p.id}', '${p.name.replace(/'/g, "\\'")}', '${p.code}', ${p.price}, '${imgUrl}')" style="margin-top:1rem;">
                        <i class="fas fa-cart-plus"></i> Añadir al Carrito
                    </button>
                    
                    <a href="https://wa.me/5493404521246?text=Hola,%20quisiera%20consultar%20por%20el%20producto:%20${encodeURIComponent(p.name)}" target="_blank" class="m-btn m-btn-success">
                        <i class="fab fa-whatsapp"></i> Consultar por WhatsApp
                    </a>
                </div>
            `;
        });
    </script>
</body>
</html>
